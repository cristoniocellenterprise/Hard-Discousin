<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hard Discousin - IA local</title>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#1f6feb;--green:#2ea44f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;overflow:hidden}
    aside{width:290px;background:var(--panel);border-right:1px solid var(--border);padding:22px;display:flex;flex-direction:column;gap:22px}h1{font-size:20px;margin:0;color:#fff}h1 span{color:#58a6ff}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
    .mode{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;border-radius:7px;padding:12px;margin:5px 0;cursor:pointer}.mode:hover,.mode.active{background:#1f6feb22;border-color:var(--blue)}.mode strong{display:block}.mode small{color:var(--muted)}
    main{flex:1;display:flex;flex-direction:column;min-width:0}header{height:64px;padding:0 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.status{display:flex;gap:9px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}#modeLabel{font-weight:700}.badge{font-size:12px;color:var(--muted)}
    #chat{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:15px}.message{max-width:min(850px,86%);padding:14px 17px;border-radius:9px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.system{background:var(--panel);border:1px solid var(--border);align-self:flex-start}.user{background:var(--blue);color:#fff;align-self:flex-end}.message pre{white-space:pre;overflow:auto;background:#010409;border:1px solid var(--border);padding:13px;border-radius:6px;margin:10px 0 0;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.message code{font-family:ui-monospace,monospace;color:#ff7b72}.composer{border-top:1px solid var(--border);padding:18px 28px}.input-row{display:flex;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px}.input-row input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}.input-row button{background:var(--blue);border:0;border-radius:6px;color:#fff;padding:8px 19px;font-weight:600;cursor:pointer}.input-row button:disabled{opacity:.5}.hint{color:var(--muted);font-size:12px;margin:8px 2px 0}
    @media(max-width:700px){aside{width:190px;padding:14px}.mode{padding:9px 7px}header,#chat,.composer{padding-left:15px;padding-right:15px}.badge{display:none}}
  </style>
</head>
<body>
  <aside>
    <h1>💾 Hard <span>Discousin</span></h1>
    <section><p class="eyebrow">Funciones de IA</p>
      <button class="mode active" data-mode="basica"><strong>⚡ Básica</strong><small>Saludos, definiciones y cálculo</small></button>
      <button class="mode" data-mode="desarrollada"><strong>🧠 Desarrollada</strong><small>Análisis, resumen y planificación</small></button>
      <button class="mode" data-mode="codigo"><strong>💻 Programación</strong><small>Genera y explica código</small></button>
    </section>
    <p class="badge" style="margin-top:auto">IA local · sin API ni dependencias</p>
  </aside>
  <main>
    <header><div class="status"><span class="dot"></span>Modo activo: <span id="modeLabel">Básica</span></div><span class="badge">Hard-Discousin</span></header>
    <div id="chat" aria-live="polite"></div>
    <div class="composer"><div class="input-row"><input id="input" autocomplete="off" placeholder="Escribe un mensaje..." aria-label="Mensaje"><button id="send">Enviar</button></div><div class="hint">Enter para enviar · Cambia de función desde el menú</div></div>
  </main>
  <script>
    'use strict';
    const state={mode:'basica',history:JSON.parse(localStorage.getItem('hd-history')||'[]')};
    const $=id=>document.getElementById(id);
    const modeNames={basica:'Básica',desarrollada:'Desarrollada',codigo:'Programación'};
    function escapeHtml(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
    function renderText(text){return escapeHtml(text).replace(/```([\s\S]*?)```/g,(_,code)=>'<pre>'+code.trim()+'</pre>').replace(/`([^`]+)`/g,'<code>$1</code>');}
    function addMessage(role,text,save=true){const item=document.createElement('div');item.className='message '+role;item.innerHTML=renderText(text);$('chat').appendChild(item);$('chat').scrollTop=$('chat').scrollHeight;if(save){state.history.push({role,text});localStorage.setItem('hd-history',JSON.stringify(state.history.slice(-40)));}}
    function welcome(){const text={basica:'Hola. Soy la IA básica. Puedo saludar, explicar conceptos breves y resolver operaciones como 12 * 4.',desarrollada:'Modo desarrollado activo. Puedo analizar textos, resumirlos y crear planes paso a paso.',codigo:'Modo programación activo. Puedo generar ejemplos funcionales en JavaScript, Python y HTML.'}[state.mode];addMessage('system',text,false);}
    function calculate(input){if(!/^[0-9+\-*/%().\s]+$/.test(input))return null;try{const result=Function('"use strict";return ('+input+')')();return Number.isFinite(result)?String(result):null}catch{return null;}}
    function basicReply(q){const clean=q.trim(),low=clean.toLowerCase(),calc=calculate(clean);if(calc!==null)return 'Resultado: '+calc;if(/^(hola|buenas|hey|saludos)/.test(low))return '¡Hola! Estoy listo para ayudarte.';if(low.includes('gracias'))return '¡De nada!';const defs={javascript:'JavaScript es un lenguaje que permite crear interactividad en páginas web.',html:'HTML define la estructura y el contenido de una página web.',css:'CSS controla la presentación visual de documentos HTML.',ia:'La inteligencia artificial usa algoritmos para realizar tareas que normalmente requieren razonamiento humano.'};for(const key in defs)if(low.includes(key))return defs[key];return 'Puedo responder saludos, definiciones y operaciones matemáticas. Prueba, por ejemplo: “¿qué es JavaScript?” o “25 / 5”.';}
    function developedReply(q){const low=q.toLowerCase();if(low.startsWith('resume')||low.startsWith('resum')){const words=q.split(/\s+/).slice(1);return words.length?'Resumen: '+words.slice(0,35).join(' ')+(words.length>35?'…':''):'Pega después de “resume” el texto que quieres resumir.';}if(low.includes('plan')||low.includes('aprender'))return 'Plan recomendado:\n1. Define el objetivo y el resultado esperado.\n2. Divide el trabajo en tareas pequeñas.\n3. Prioriza la primera tarea y establece una fecha.\n4. Comprueba el resultado y ajusta el siguiente paso.';return 'Análisis desarrollado: '+q+'\n\nInterpretación: la petición necesita identificar objetivo, contexto y resultado esperado.\n\nSiguiente paso: especifica el formato, las restricciones y un ejemplo para producir una respuesta más precisa.';}
    function codeReply(q){const low=q.toLowerCase();if(low.includes('python'))return 'Aquí tienes una función Python funcional:\n```python\ndef saludar(nombre: str) -> str:\n    """Devuelve un saludo personalizado."""\n    return f"Hola, {nombre}!"\n\nprint(saludar("Mundo"))\n```';if(low.includes('html'))return 'Aquí tienes una página HTML funcional:\n```html\n<!doctype html>\n<html lang="es"><body>\n  <button id="saludar">Saludar</button>\n  <p id="resultado"></p>\n  <script>\n    document.querySelector("#saludar").onclick = () => {\n      document.querySelector("#resultado").textContent = "¡Hola!";\n    };\n  <\/script>\n</body></html>\n```';return 'Ejemplo JavaScript funcional para tu solicitud:\n```javascript\nfunction resolver(pregunta) {\n  if (!pregunta?.trim()) throw new Error("La pregunta está vacía");\n  return `Solicitud recibida: ${pregunta.trim()}`;\n}\n\nconsole.log(resolver("'+q.replace(/[`\\]/g,'')+'"));\n```\n\nPide “Python” o “HTML” para cambiar el lenguaje.';}
    function reply(q){return state.mode==='basica'?basicReply(q):state.mode==='desarrollada'?developedReply(q):codeReply(q);}
    function send(){const input=$('input'),q=input.value.trim();if(!q)return;addMessage('user',q);input.value='';$('send').disabled=true;setTimeout(()=>{addMessage('system',reply(q));$('send').disabled=false;input.focus();},250);}
    document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>{state.mode=button.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('modeLabel').textContent=modeNames[state.mode];welcome();}));
    $('send').addEventListener('click',send);$('input').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
    if(state.history.length){state.history.forEach(m=>addMessage(m.role,m.text,false));}else welcome();
  </script>
</body>
</html>
